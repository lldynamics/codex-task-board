name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS is the only supported platform; 22.13.0 is the declared minimum.
        os: [ubuntu-latest, macos-latest]
        node: ["22.13.0", 22, 24]
    steps:
      # Official immutable releases, checked 2026-10-05:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      # https://github.com/actions/setup-node/releases/tag/v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Tests launch only injected temporary-store factories, never server.js.
      - run: npm test
      - run: npm run check:release
      - name: Package reproducible plugin
        run: node scripts/package-release.mjs --output-dir "$RUNNER_TEMP/codex-task-board-release"
      - name: Synthetic JSDOM benchmark (report only)
        run: npm run benchmark -- --sizes 100,1000 --iterations 1
